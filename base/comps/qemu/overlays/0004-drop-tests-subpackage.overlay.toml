[metadata]
category = "azl-feature-disablement"

# qemu-tests ships per-arch test binaries, qemu-iotests fixture images, and
# related artefacts that trip the automated package-signing pipeline's
# FS-aware deep scanner. The subpackage is test-only and not shipped in any
# Azure Linux image, so we drop it entirely.
#
# Implementation notes:
# * `%define testsdir` lives inside the removed `%package tests` block but is
#   referenced from `%install`; we re-hoist it via `%define` (lazy expansion of
#   `%{name}` / `%{_libdir}`) near the other top-of-spec `%global` declarations
#   so `%install` still expands cleanly.
# * The `%install` section still writes test artefacts under `%{testsdir}` and
#   builds `accel-qtest-*.so` plugins, so we rm them from the buildroot after
#   install to avoid "Installed (but unpackaged)" errors.

[[overlays]]
description = "Hoist %define testsdir so %install expands correctly after %package tests is removed"
type        = "spec-search-replace"
regex       = '^%global enable_werror 0$'
replacement = "%global enable_werror 0\n%define testsdir %{_libdir}/%{name}/tests-src"

[[overlays]]
description = "Remove qemu-tests subpackage"
type        = "spec-remove-subpackage"
package     = "tests"

[[overlays]]
description = "Drop test artefacts from buildroot after install (paired with qemu-tests removal)"
type        = "spec-append-lines"
section     = "%install"
lines       = [
  "# Azure Linux: qemu-tests subpackage removed; drop its payload from buildroot.",
  "rm -rf %{buildroot}%{testsdir}",
  "rm -f %{buildroot}%{_libdir}/%{name}/accel-qtest-*.so",
]
