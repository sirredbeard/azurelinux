[metadata]
category = "azl-feature-disablement"

[[overlays]]
description = "Disable Xen support - not needed for Azure Linux (Hyper-V/KVM only)"
type        = "spec-search-replace"
regex       = '^%global have_xen 1$'
replacement = '%global have_xen 0'

[[overlays]]
description = "Disable Baum Braille (brltty) - pulls bluetooth, audio, and more runtime deps"
type        = "spec-search-replace"
regex       = '^%global have_brlapi 1$'
replacement = '%global have_brlapi 0'

[[overlays]]
description = "Disable SPICE support"
type        = "spec-search-replace"
regex       = '^%global have_spice 1$'
replacement = '%global have_spice 0'

[[overlays]]
description = "Disable D-Bus display server; meson would otherwise build audio-dbus.so and trip 'Installed (but unpackaged)' once the audio-dbus subpackage is removed"
type        = "spec-search-replace"
regex       = '^%global have_dbus_display 1$'
replacement = '%global have_dbus_display 0'
