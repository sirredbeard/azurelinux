# Temporary backport of upstream Fedora commit 41cae067 ("Update to git4a3650d
# branch stable-202601") which updated the Source URLs from erislabs.net to
# salsa.debian.org. The old gitweb query-string URLs can't be parsed by the
# rendered-spec filter, so check-module.1 and gnulib-tool.1 get dropped.
# Appending #/filename hints lets the filter extract the correct basename.
# Remove this file when the snapshot advances past that commit.

[metadata]
category = "backport-fedora"
commits = ["https://src.fedoraproject.org/rpms/gnulib/c/41cae067"]
fixed-in = "gnulib-0-57.20260302git4a3650d.fc44"
removable-after = "f44"

[[overlays]]
description = "Temporary: append #/filename hint to Source1 so rendered spec filter can match check-module.1. Remove when snapshot includes f43 commit 41cae067."
type = "spec-update-tag"
tag = "Source1"
value = "https://erislabs.net/gitweb/?p=gnulib.git;a=blob_plain;hb=HEAD;f=debian/manpages/check-module.1#/check-module.1"

[[overlays]]
